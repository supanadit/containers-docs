name: Build and Publish Docs Container

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GCR_TOKEN }}

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/containers-docs:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/containers-docs:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/containers-docs:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/containers-docs:buildcache,mode=max,ignore-error=true

      - name: Build cache only (manual dispatch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/containers-docs:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/containers-docs:buildcache,mode=max,ignore-error=true
